name: Build RONG LAB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, os

          files = glob.glob("*.zip")
          if len(files) != 1:
              raise SystemExit("Expected exactly one ZIP")

          with zipfile.ZipFile(files[0]) as z:
              z.extractall("extracted")

          roots = [
              os.path.join("extracted", x)
              for x in os.listdir("extracted")
              if os.path.isfile(
                  os.path.join("extracted", x, "package.json")
              )
          ]

          if len(roots) != 1:
              raise SystemExit("Cannot find project root")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("PROJECT_DIR=" + roots[0] + "\n")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import re, json
          meta = json.loads(Path('package.json').read_text())
          code, version = meta.get('androidVersionCode'), meta.get('version')
          if not isinstance(code, int) or code < 1 or not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid version or androidVersionCode in package.json')
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, count_code = re.subn(r'versionCode\s+\d+', 'versionCode ' + str(code), s, count=1)
          s, count_name = re.subn(r'versionName\s+"[^"]+"', 'versionName "' + version + '"', s, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit('Cannot set Android version safely')
          p.write_text(s)
          PY_VERSION

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with the fixed testing key
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          RONG_KEYSTORE_BASE64: ${{ secrets.RONG_KEYSTORE_BASE64 }}
          RONG_KEYSTORE_PASSWORD: ${{ secrets.RONG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -eu
          if [ -z "$RONG_KEYSTORE_BASE64" ] || [ -z "$RONG_KEYSTORE_PASSWORD" ]; then
            echo "Missing RONG_KEYSTORE_BASE64 or RONG_KEYSTORE_PASSWORD secret."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/rong-signing-key.jks"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$RONG_KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY_FILE" --ks-key-alias ronglab \
            --ks-pass env:RONG_KEYSTORE_PASSWORD \
            --key-pass env:RONG_KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/rong-signed.apk" "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/rong-signed.apk"
          mv "$RUNNER_TEMP/rong-signed.apk" "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RONG-LAB-Android-Debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
