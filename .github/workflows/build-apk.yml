name: Build RONG LAB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, os

          files = glob.glob("*.zip")
          if len(files) != 1:
              raise SystemExit(
                  "Expected exactly one ZIP in repository root"
              )

          with zipfile.ZipFile(files[0]) as z:
              z.extractall("extracted")

          roots = [
              x for x in os.listdir("extracted")
              if os.path.isdir("extracted/" + x)
          ]

          if len(roots) != 1:
              raise SystemExit("Unexpected ZIP structure")

          root = os.path.join("extracted", roots[0])
          for name in os.listdir(root):
              os.rename(
                  os.path.join(root, name),
                  os.path.join(".", name)
              )
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RONG-LAB-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
